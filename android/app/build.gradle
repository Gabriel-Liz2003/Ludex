plugins { id 'com.android.application' }

def ludexKeystore = System.getenv('LUDEX_ANDROID_KEYSTORE')

android {
    namespace 'com.ludex.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'com.ludex.mobile'
        minSdk 26
        targetSdk 36
        versionCode 20
        versionName '0.9.14'
    }
    signingConfigs {
        ludexRelease {
            if (ludexKeystore) {
                storeFile file(ludexKeystore)
                storePassword System.getenv('LUDEX_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('LUDEX_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('LUDEX_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ludexKeystore) signingConfig signingConfigs.ludexRelease
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
