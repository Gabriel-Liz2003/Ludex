name: test-coverage-once

on:
  push:
    branches: ["feat/ludex-foundation"]

permissions:
  contents: write

jobs:
  add-tests:
    if: ${{ !contains(github.event.head_commit.message, '[coverage-once]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ludex-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python scripts/add_process_v2_coverage.py
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          git commit -m "test: cover duplicate and external session discovery [coverage-once]"
          git push origin HEAD:feat/ludex-foundation
