name: test-coverage-once

on:
  push:
    branches: ["feat/ludex-foundation"]

permissions:
  contents: write

jobs:
  add-tests:
    if: ${{ !contains(github.event.head_commit.message, '[coverage-once]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ludex-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add duplicate/external coverage
        shell: python
        run: |
          from pathlib import Path

          monitor = Path('src-tauri/src/process_monitor.rs')
          text = monitor.read_text(encoding='utf-8')
          old = '        assert!(candidate.score >= LAUNCH_SCORE_THRESHOLD);\n'
          new = '        assert!(candidate.score >= LAUNCH_SCORE_THRESHOLD);\n        assert!(candidate.score >= EXTERNAL_SCORE_THRESHOLD);\n'
          if old not in text:
              raise SystemExit('candidate score assertion not found')
          text = text.replace(old, new, 1)
          monitor.write_text(text, encoding='utf-8')

          sessions = Path('src-tauri/src/sessions.rs')
          text = sessions.read_text(encoding='utf-8')
          old_import = '    use super::{duration_between, has_legitimate_game_process, safe_recovery_duration};\n    use crate::process_monitor::ProcessInfo;\n'
          new_import = '    use super::{\n        create_session, duration_between, has_legitimate_game_process, safe_recovery_duration,\n    };\n    use crate::{db, process_monitor::ProcessInfo};\n    use std::fs;\n    use uuid::Uuid;\n'
          if old_import not in text:
              raise SystemExit('sessions test imports not found')
          text = text.replace(old_import, new_import, 1)

          test = r'''

    #[test]
    fn duplicate_active_session_for_installation_is_rejected() {
        let path = std::env::temp_dir().join(format!("ludex-session-test-{}.db", Uuid::new_v4()));
        let connection = db::open(&path).unwrap();
        db::add_manual_game(
            &connection,
            "session-test-game",
            "Session Test Game",
            "PC",
            Some("D:\\Game\\game.exe"),
            Some("D:\\Game"),
            None,
        )
        .unwrap();
        let installation = db::installation_for_launch(&connection, "session-test-game")
            .unwrap()
            .unwrap();
        drop(connection);

        let candidate = process("game.exe", 42);
        let first = create_session(
            &path,
            &installation,
            &candidate,
            "external_detection",
            "2026-08-28T12:00:00+00:00",
            "test candidate",
        )
        .unwrap();
        let second = create_session(
            &path,
            &installation,
            &candidate,
            "ludex_launch",
            "2026-08-28T12:00:01+00:00",
            "duplicate candidate",
        )
        .unwrap();

        assert!(first.is_some());
        assert!(second.is_none());
        let connection = db::open(&path).unwrap();
        let count: i64 = connection
            .query_row(
                "SELECT COUNT(*) FROM play_sessions WHERE installation_id=?1 AND ended_at IS NULL",
                [&installation.id],
                |row| row.get(0),
            )
            .unwrap();
        assert_eq!(count, 1);
        drop(connection);
        let _ = fs::remove_file(path);
    }
'''
          if 'duplicate_active_session_for_installation_is_rejected' in text:
              raise SystemExit('duplicate test already present')
          pos = text.rfind('\n}')
          if pos < 0:
              raise SystemExit('sessions test module closing brace not found')
          text = text[:pos] + test + text[pos:]
          sessions.write_text(text, encoding='utf-8')
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          git commit -m "test: cover duplicate and external session discovery [coverage-once]"
          git push origin HEAD:feat/ludex-foundation
