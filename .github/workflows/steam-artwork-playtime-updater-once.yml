name: steam-artwork-playtime-updater-once

on:
  push:
    branches: [feat/steam-artwork-playtime-updater]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/steam-artwork-playtime-updater
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python scripts/apply-steam-artwork-playtime-updater.py
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Keep workflow files unchanged in generated commit
        shell: bash
        run: |
          git checkout HEAD -- .github/workflows/steam-artwork-playtime-updater-once.yml
          rm -f .github/workflows/release.yml
      - name: Commit generated increment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: Steam artwork, playtime import and in-app updater [generated]"
          git push origin HEAD:feat/steam-artwork-playtime-updater
