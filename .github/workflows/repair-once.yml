name: repair-once

on:
  push:
    branches: ["feat/ludex-foundation"]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ludex-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply compatibility fixes and add icon
        shell: python {0}
        run: |
          from pathlib import Path
          import base64

          icon = ""
          icon_path = Path("src-tauri/icons/icon.ico")
          icon_path.parent.mkdir(parents=True, exist_ok=True)
          icon_path.write_bytes(base64.b64decode(icon))

          db = Path("src-tauri/src/db.rs")
          text = db.read_text(encoding="utf-8")
          old = '("updated_at", "TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP"),'
          new = '("updated_at", "TEXT"),'
          if old not in text:
              raise SystemExit("expected migration definition not found")
          text = text.replace(old, new, 1)
          marker = '         CREATE INDEX IF NOT EXISTS idx_external_ids_game ON external_ids(game_id);"\n    )'
          replacement = '         CREATE INDEX IF NOT EXISTS idx_external_ids_game ON external_ids(game_id);\n         UPDATE installations SET updated_at=CURRENT_TIMESTAMP WHERE updated_at IS NULL;"\n    )'
          if marker not in text:
              raise SystemExit("migration batch marker not found")
          text = text.replace(marker, replacement, 1)

          test_block = r'''

#[cfg(test)]
mod import_tests {
    use super::{add_manual_game, import_installations, list_games, open};
    use crate::models::ScannedInstallation;
    use std::fs;
    use uuid::Uuid;

    fn temp_db() -> std::path::PathBuf {
        std::env::temp_dir().join(format!("ludex-test-{}.db", Uuid::new_v4()))
    }

    fn steam_game(external_id: &str, title: &str) -> ScannedInstallation {
        ScannedInstallation {
            provider: "steam".into(),
            external_id: external_id.into(),
            title: title.into(),
            platform: "PC".into(),
            install_dir: Some("C:\\Games\\Cyberpunk 2077".into()),
            executable: None,
            installed: true,
            size_bytes: Some(100),
            last_updated: Some(1),
        }
    }

    #[test]
    fn steam_reimport_is_idempotent() {
        let path = temp_db();
        let connection = open(&path).unwrap();
        let item = steam_game("1091500", "Cyberpunk 2077™");
        import_installations(&connection, "steam", std::slice::from_ref(&item), "C:\\Steam", 1).unwrap();
        import_installations(&connection, "steam", std::slice::from_ref(&item), "C:\\Steam", 1).unwrap();
        assert_eq!(list_games(&connection).unwrap().len(), 1);
        let count: i64 = connection.query_row("SELECT COUNT(*) FROM installations WHERE provider='steam'", [], |row| row.get(0)).unwrap();
        assert_eq!(count, 1);
        drop(connection);
        let _ = fs::remove_file(path);
    }

    #[test]
    fn unique_normalized_title_deduplicates_manual_identity() {
        let path = temp_db();
        let connection = open(&path).unwrap();
        add_manual_game(&connection, "manual-cp", "Cyberpunk 2077", "PC", None, None, None).unwrap();
        let result = import_installations(&connection, "steam", &[steam_game("1091500", "Cyberpunk 2077™")], "C:\\Steam", 1).unwrap();
        assert_eq!(result.games_created, 0);
        assert_eq!(list_games(&connection).unwrap().len(), 1);
        drop(connection);
        let _ = fs::remove_file(path);
    }
}
'''
          if "mod import_tests" not in text:
              text += test_block
          db.write_text(text, encoding="utf-8")
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "fix: Windows resource, migration compatibility and dedup tests [repair]"
          git push origin HEAD:feat/ludex-foundation
