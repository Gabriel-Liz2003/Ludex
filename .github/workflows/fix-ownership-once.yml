name: fix-ownership-once
on:
  push:
    branches: ["feat/ludex-foundation"]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[ownership-once]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ludex-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python scripts/fix-rust-ownership.py
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          git commit -m "fix: resolve Rust ownership errors [ownership-once]" || exit 0
          git push origin HEAD:feat/ludex-foundation
