name: apply-0.9.2-once

on:
  push:
    branches: [feat/0.9.2-library-store]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[0.9.2-applied]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/0.9.2-library-store
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python scripts/fix-store-0.9.2.py
      - run: python scripts/apply-0.9.2.py
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - run: npm install
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Keep helper files unchanged
        shell: bash
        run: |
          git checkout HEAD -- .github/workflows/apply-0.9.2-once.yml scripts/apply-0.9.2.py scripts/fix-store-0.9.2.py
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json README.md android/app/build.gradle src src-tauri
          git commit -m "feat: complete Steam library and add price comparison store [0.9.2-applied]"
          git push origin HEAD:feat/0.9.2-library-store
