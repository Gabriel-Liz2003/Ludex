name: apply-0.9.5-performance-once
on:
  push:
    branches: [fix/0.9.5-large-library-performance]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[0.9.5-applied]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.9.5-large-library-performance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply patch
        run: python scripts/apply-0.9.5-performance.py
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Frontend build
        run: |
          npm install
          npm run build
      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Gabriel-Liz"
          git config user.email "102968582+Gabriel-Liz2003@users.noreply.github.com"
          git add src/main.ts package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "fix: optimize large library startup [0.9.5-applied]"
          git push origin HEAD:fix/0.9.5-large-library-performance
