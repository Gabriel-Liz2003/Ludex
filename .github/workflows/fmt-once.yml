name: fmt-once

on:
  push:
    branches: ["feat/ludex-foundation"]

permissions:
  contents: write

jobs:
  fmt:
    if: ${{ !contains(github.event.head_commit.message, '[fmt]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ludex-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit rustfmt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          git commit -m "style: format process discovery v2 [fmt]"
          git push origin HEAD:feat/ludex-foundation
