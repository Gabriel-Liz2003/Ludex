name: fix-imported-playtime-once

on:
  push:
    branches: [feat/steam-artwork-playtime-updater]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[migration-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/steam-artwork-playtime-updater
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python scripts/fix-imported-playtime-migration.py
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Keep workflow unchanged
        shell: bash
        run: git checkout HEAD -- .github/workflows/fix-imported-playtime-once.yml
      - name: Commit migration fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/db.rs
          git commit -m "fix: create imported playtime in core database migration [migration-fix]"
          git push origin HEAD:feat/steam-artwork-playtime-updater
