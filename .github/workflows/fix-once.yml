name: fix-once

on:
  push:
    branches: ["feat/ludex-foundation"]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[fix-once]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ludex-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply compile fix
        shell: python
        run: |
          from pathlib import Path

          monitor = Path('src-tauri/src/process_monitor.rs')
          text = monitor.read_text(encoding='utf-8')
          text = text.replace('use sysinfo::{Pid, System};', 'use sysinfo::System;')
          monitor.write_text(text, encoding='utf-8')

          sessions = Path('src-tauri/src/sessions.rs')
          text = sessions.read_text(encoding='utf-8')
          text = text.replace('        classify_process, CandidateContext, ProcessInfo, ProcessMonitor, ProcessRole,\n        TrackedProcess, EXTERNAL_SCORE_THRESHOLD, LAUNCH_SCORE_THRESHOLD,', '        classify_process, CandidateContext, ProcessInfo, ProcessMonitor, ProcessRole,\n        EXTERNAL_SCORE_THRESHOLD, LAUNCH_SCORE_THRESHOLD,')
          text = text.replace('runtime.and_then(|(pid, start, path)| Some((pid? as u32, start? as u64, path?)))', 'runtime.clone().and_then(|(pid, start, path)| Some((pid? as u32, start? as u64, path?)))')
          sessions.write_text(text, encoding='utf-8')
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          git commit -m "fix: preserve recovery state ownership [fix-once]"
          git push origin HEAD:feat/ludex-foundation
