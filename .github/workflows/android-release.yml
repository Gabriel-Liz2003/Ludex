name: android-release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'

permissions:
  contents: write

jobs:
  signed-android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - id: version
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 não configurado"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ANDROID_STORE_PASSWORD não configurado"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS não configurado"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD não configurado"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ludex-release.keystore"
      - name: Build signed APK
        env:
          LUDEX_ANDROID_KEYSTORE: ${{ runner.temp }}/ludex-release.keystore
          LUDEX_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          LUDEX_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LUDEX_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease --stacktrace
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Ludex-Android-${{ steps.version.outputs.version }}.apk"
          cd dist
          sha256sum "Ludex-Android-${{ steps.version.outputs.version }}.apk" > "Ludex-Android-${{ steps.version.outputs.version }}.apk.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.version.outputs.version }}
          name: Ludex Android v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/Ludex-Android-${{ steps.version.outputs.version }}.apk
            dist/Ludex-Android-${{ steps.version.outputs.version }}.apk.sha256
