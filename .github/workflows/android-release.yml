name: android-release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'

permissions:
  contents: write

jobs:
  signed-android-release:
    runs-on: ubuntu-latest
    steps:
      - id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets ainda não configurados; release assinada ignorada."
          fi
      - if: steps.signing.outputs.available == 'true'
        uses: actions/checkout@v4
      - if: steps.signing.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: steps.signing.outputs.available == 'true'
        name: Prepare Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - if: steps.signing.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - if: steps.signing.outputs.available == 'true'
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - if: steps.signing.outputs.available == 'true'
        name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ludex-release.keystore"
      - if: steps.signing.outputs.available == 'true'
        name: Build signed APK
        env:
          LUDEX_ANDROID_KEYSTORE: ${{ runner.temp }}/ludex-release.keystore
          LUDEX_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          LUDEX_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LUDEX_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease --stacktrace
      - if: steps.signing.outputs.available == 'true'
        name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Ludex-Android-${{ steps.version.outputs.version }}.apk"
          cd dist
          sha256sum "Ludex-Android-${{ steps.version.outputs.version }}.apk" > "Ludex-Android-${{ steps.version.outputs.version }}.apk.sha256"
      - if: steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.version.outputs.version }}
          name: Ludex Android v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/Ludex-Android-${{ steps.version.outputs.version }}.apk
            dist/Ludex-Android-${{ steps.version.outputs.version }}.apk.sha256
